<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Equipos Celulares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="./css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark brand-navbar shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-phone-fill fs-4"></i>
                Inventario de Equipos
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Header del Panel -->
        <div class="hero-section text-start ps-0">
            <h1 class="page-title mb-2">Panel de Inventario</h1>
            <p class="text-secondary font-mono">Gestión de equipos celulares prestados</p>
        </div>

        <!-- Tarjetas de Estadísticas -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="stat-card">
                    <i class="bi bi-phone text-cyan mb-2 fs-3"></i>
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Total Equipos</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <i class="bi bi-check-circle text-green mb-2 fs-3"></i>
                    <div class="stat-number" id="statDisponibles">0</div>
                    <div class="stat-label">Disponibles</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <i class="bi bi-hand-index-thumb text-amber mb-2 fs-3"></i>
                    <div class="stat-number" id="statPrestados">0</div>
                    <div class="stat-label">Prestados</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <i class="bi bi-tools text-red mb-2 fs-3"></i>
                    <div class="stat-number" id="statMantenimiento">0</div>
                    <div class="stat-label">Mantenimiento</div>
                </div>
            </div>
        </div>

        <!-- Sección de Listado -->
        <div class="card shadow-lg border-0 mb-5">
            <div class="card-header d-flex justify-content-between align-items-center bg-transparent py-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-list-task fs-5"></i>
                    <span class="fs-5">Listado de Equipos</span>
                </div>
                <span class="text-muted small font-mono" id="registrosCount">0 registros</span>
            </div>
            <div class="card-body p-4">
                <!-- Filtros estilo imagen -->
                <div class="row g-3 mb-4 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre, marca...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="filterEstado" class="form-select">
                            <option value="">Todos los estados</option>
                            <option value="disponible">Disponible</option>
                            <option value="prestado">Prestado</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="filterMarca" class="form-control" placeholder="Marca">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="loadEquipos()">
                            <i class="bi bi-funnel-fill me-1"></i> Filtrar
                        </button>
                    </div>
                </div>

                <!-- Tabla de Equipos -->
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>EQUIPO</th>
                                <th>MARCA / MODELO</th>
                                <th>ASIGNADO A</th>
                                <th>FECHA PRÉSTAMO</th>
                                <th>ESTADO</th>
                                <th class="text-end">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="equiposTableBody">
                            <!-- Los datos se cargarán aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="equipoModal" tabindex="-1" aria-labelledby="equipoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="equipoForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="equipoModalLabel">Nuevo Equipo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="equipoId">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Equipo *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="marca" class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marca">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modelo" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="modelo">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="inputImagen" class="form-label">Imagen URL</label>
                            <input type="url" class="form-control" id="inputImagen" placeholder="https://ejemplo.com/celular.jpg">
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" onchange="togglePrestadoA()">
                                <option value="disponible">Disponible</option>
                                <option value="prestado">Prestado</option>
                            </select>
                        </div>

                        <div id="prestadoAContainer" style="display: none;">
                            <div class="mb-3">
                                <label for="prestado_a" class="form-label">Prestado a *</label>
                                <input type="text" class="form-control" id="prestado_a">
                            </div>
                            <div class="mb-3">
                                <label for="fecha_devolucion" class="form-label">Fecha límite de devolución *</label>
                                <input type="date" class="form-control" id="fecha_devolucion">
                            </div>
                        </div>

                        <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
