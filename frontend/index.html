<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Equipos Celulares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="./css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark brand-navbar shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-phone-fill fs-4"></i>
                Inventario de Equipos
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4 align-items-center bg-white p-3 rounded-4 shadow-sm mx-0">
            <div class="col-md-5 mb-3 mb-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i
                            class="bi bi-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                        placeholder="Buscar equipo por nombre...">
                </div>
            </div>
            <div class="col-md-4 mb-3 mb-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i
                            class="bi bi-funnel text-muted"></i></span>
                    <select id="filterEstado" class="form-select border-start-0 ps-0 shadow-none">
                        <option value="">Todos los estados</option>
                        <option value="disponible">Disponibles</option>
                        <option value="prestado">Prestados</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3 text-md-end">
                <button class="btn btn-primary rounded-pill px-4 fw-semibold w-100 shadow-sm" data-bs-toggle="modal"
                    data-bs-target="#equipoModal" onclick="prepareAdd()">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Equipo
                </button>
            </div>
        </div>

        <div class="row g-4" id="equiposGrid">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Cargando equipos...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="equipoModal" tabindex="-1" aria-labelledby="equipoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="equipoForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="equipoModalLabel">Nuevo Equipo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="equipoId">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Equipo *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="marca" class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marca">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modelo" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="modelo">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="inputImagen" class="form-label">Imagen URL</label>
                            <input type="url" class="form-control" id="inputImagen" placeholder="https://ejemplo.com/celular.jpg">
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" onchange="togglePrestadoA()">
                                <option value="disponible">Disponible</option>
                                <option value="prestado">Prestado</option>
                            </select>
                        </div>

                        <div id="prestadoAContainer" style="display: none;">
                            <div class="mb-3">
                                <label for="prestado_a" class="form-label">Prestado a *</label>
                                <input type="text" class="form-control" id="prestado_a">
                            </div>
                            <div class="mb-3">
                                <label for="fecha_devolucion" class="form-label">Fecha límite de devolución *</label>
                                <input type="date" class="form-control" id="fecha_devolucion">
                            </div>
                        </div>

                        <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
